<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Smart Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#f49d25",
                "background-light": "#f8f7f5",
                "background-dark": "#221a10",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
</head>
<body class="dark bg-background-dark font-display min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Image with Blur and Overlay -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat blur-[6px] opacity-40 scale-105" data-alt="Blurred modern restaurant interior with warm lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD_FH6sVDTYWGxHMk8gVckuOH9pXpA_v-GM6J-sS0Dz3hlRI2hCbtd68d3bLA_JiEHduhOGmDK9KZvjTXzBoGlPd3T2BfNsREOacx3ybTnuypeurV3B1sOn4mgzOorwz2PAqi4pZpuRrqSLURXuzkrDx0L5UsE8ZWXGWKX1CPQhBvzOxbxiIv77Hlo3wAMvUMxPWrPEXr13ubkmCiOJDuA0lM9fFQYeRM8nrqjTy_99JyaKlDgYgJNidQMi0PAFxlqJoetJ1tzx2Vc");'></div>
<!-- Gradient Overlay to ensure text contrast and theme consistency -->
<div class="absolute inset-0 bg-gradient-to-b from-background-dark/90 via-background-dark/80 to-background-dark/95"></div>
</div>
<!-- Main Container -->
<div class="relative z-10 w-full max-w-[480px] p-4">
<!-- Login Card -->
<div class="bg-[#1c160d] dark:bg-[#1c160d]/90 backdrop-blur-md border border-white/10 rounded-xl shadow-2xl overflow-hidden">
<!-- Header Section -->
<div class="p-8 pb-6 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center mb-6 ring-1 ring-primary/30">
<span class="material-symbols-outlined text-primary text-4xl">restaurant_menu</span>
</div>
<h1 class="text-white text-3xl font-black tracking-tight mb-2">Welcome Back</h1>
<p class="text-white/60 text-sm font-normal">Smart Restaurant Backoffice Admin</p>
</div>
<!-- Form Section -->
<div class="px-8 pb-4 space-y-5">
<!-- Username Field -->
<div class="space-y-2">
<label class="text-white/90 text-sm font-medium ml-1 block" for="username">Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-white/40 group-focus-within:text-primary transition-colors duration-300 text-[20px]">person</span>
</div>
<input class="form-input block w-full pl-11 pr-4 py-3.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/30 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white/10 transition-all duration-200 outline-none text-base" id="username" placeholder="admin@restaurant.com" type="text" value=""/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-white/90 text-sm font-medium" for="password">Password</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-white/40 group-focus-within:text-primary transition-colors duration-300 text-[20px]">lock</span>
</div>
<input class="form-input block w-full pl-11 pr-12 py-3.5 bg-white/5 border border-white/10 rounded-lg text-white placeholder-white/30 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-white/10 transition-all duration-200 outline-none text-base" id="password" placeholder="••••••••" type="password" value=""/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/40 hover:text-white transition-colors cursor-pointer outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] text-background-dark font-bold py-3.5 px-6 rounded-lg shadow-lg shadow-primary/20 transition-all duration-200 flex items-center justify-center gap-2 group">
<span>Sign In</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Forgot Password & Links -->
<div class="py-4 flex flex-col items-center gap-4 border-t border-white/5 mt-4">
<a class="text-primary hover:text-primary/80 text-sm font-medium transition-colors flex items-center gap-1.5" href="#">
<span class="material-symbols-outlined text-[18px]">key</span>
                        Forgot Password?
                    </a>
</div>
</div>
<!-- Footer -->
<div class="bg-white/5 p-4 text-center">
<p class="text-white/30 text-xs">© 2024 Smart Restaurant Systems. v2.1.0</p>
</div>
</div>
</div>
</body></html>
